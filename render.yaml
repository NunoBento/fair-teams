services:
  - type: pserv
    name: fiveaside-mongodb
    runtime: docker
    autoDeploy: false
    plan: free
    disk:
      name: data
      mountPath: /data/db
      sizeGB: 10

  - type: web
    runtime: node
    name: fiveaside-frontend
    plan: free
    buildCommand: npm install
    startCommand: npm start

  - type: web
    name: fiveaside-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod --workspace api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
